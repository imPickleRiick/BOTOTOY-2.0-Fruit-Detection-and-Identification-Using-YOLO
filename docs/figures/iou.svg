<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .t { font-size: 14px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
    .s { font-size: 12px; fill: #444; text-anchor: middle; }
    .big { font-size: 22px; fill: #1a1a1a; text-anchor: middle; }
  </style>
  <rect width="900" height="230" fill="#ffffff"/>

  <!-- example 1: good overlap -->
  <rect x="40" y="40" width="120" height="120" fill="none" stroke="#1f5e3b" stroke-width="3"/>
  <rect x="60" y="55" width="120" height="120" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 4"/>
  <rect x="60" y="55" width="100" height="105" fill="#1f5e3b" fill-opacity="0.18"/>
  <text class="t" x="110" y="200">IoU ≈ 0.57 → correct</text>
  <text class="s" x="110" y="218">(≥ 0.5 and same fruit)</text>

  <!-- example 2: poor overlap -->
  <rect x="240" y="40" width="120" height="120" fill="none" stroke="#1f5e3b" stroke-width="3"/>
  <rect x="310" y="80" width="120" height="120" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 4"/>
  <rect x="310" y="80" width="50" height="80" fill="#1f5e3b" fill-opacity="0.18"/>
  <text class="t" x="335" y="218">IoU ≈ 0.16 → wrong place</text>

  <!-- formula -->
  <text class="big" x="660" y="70">IoU =</text>
  <text class="t" x="790" y="58">area of overlap</text>
  <line x1="715" y1="66" x2="865" y2="66" stroke="#1a1a1a" stroke-width="1.5"/>
  <text class="t" x="790" y="88">area of union</text>
  <rect x="620" y="125" width="18" height="18" fill="none" stroke="#1f5e3b" stroke-width="3"/>
  <text x="648" y="139" font-size="12.5" fill="#333">ground truth (labeled by a person)</text>
  <rect x="620" y="155" width="18" height="18" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="648" y="169" font-size="12.5" fill="#333">prediction (from the model)</text>
  <rect x="620" y="185" width="18" height="18" fill="#1f5e3b" fill-opacity="0.18"/>
  <text x="648" y="199" font-size="12.5" fill="#333">overlap</text>
</svg>
