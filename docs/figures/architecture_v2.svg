<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="960" height="310" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5a52"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #4a5a52; stroke-width: 1.5; }
      .main { fill: #e6f2ea; stroke: #1f5e3b; stroke-width: 2; }
      .cv { fill: #fdf3e2; stroke: #c07a12; stroke-width: 1.5; }
      .t { font-size: 14px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
      .s { font-size: 11.5px; fill: #444; text-anchor: middle; }
      .l { font-size: 11px; fill: #4a5a52; font-style: italic; }
      .arrow { stroke: #4a5a52; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="960" height="310" fill="#ffffff"/>

  <text class="l" x="20" y="20">On the phone and the network</text>
  <rect class="box" x="20" y="30" width="210" height="80" rx="8"/>
  <text class="t" x="125" y="58">Phone camera</text>
  <text class="s" x="125" y="78">live frames (about 1.5 per second)</text>
  <text class="s" x="125" y="94">or one photo</text>

  <rect class="box" x="290" y="30" width="250" height="80" rx="8"/>
  <text class="t" x="415" y="58">HTTPS link (Wi-Fi or hotspot)</text>
  <text class="s" x="415" y="78">self-signed certificate + TLS proxy;</text>
  <text class="s" x="415" y="94">browsers allow cameras only on https</text>

  <rect class="box" x="600" y="30" width="340" height="80" rx="8"/>
  <text class="t" x="770" y="58">Fruit Reader (Streamlit app on the laptop CPU)</text>
  <text class="s" x="770" y="78">decode the frame or photo, EXIF rotation,</text>
  <text class="s" x="770" y="94">shrink to 640 px</text>

  <text class="l" x="940" y="180" text-anchor="end">On the laptop, for every frame or photo</text>
  <rect class="cv" x="20" y="190" width="205" height="90" rx="8"/>
  <text class="t" x="122" y="216">1. Photo-quality check</text>
  <text class="s" x="122" y="236">classic CV: brightness, glare,</text>
  <text class="s" x="122" y="252">sharpness, motion blur</text>
  <text class="s" x="122" y="268">→ spoken advice</text>

  <rect class="main" x="258" y="190" width="205" height="90" rx="8"/>
  <text class="t" x="360" y="216">2. YOLO11n, 31 fruits</text>
  <text class="s" x="360" y="236">fine-tuned CNN detector</text>
  <text class="s" x="360" y="252">box + fruit + confidence</text>
  <text class="s" x="360" y="268">61 ms per image</text>

  <rect class="box" x="496" y="190" width="205" height="90" rx="8"/>
  <text class="t" x="598" y="216">3. Sentence builder</text>
  <text class="s" x="598" y="236">English + Filipino names,</text>
  <text class="s" x="598" y="252">count, left / middle / right,</text>
  <text class="s" x="598" y="268">"probably", "not sure"</text>

  <rect class="box" x="734" y="190" width="206" height="90" rx="8"/>
  <text class="t" x="837" y="216">4. Speak on the phone</text>
  <text class="s" x="837" y="236">live: only when 3 frames agree;</text>
  <text class="s" x="837" y="252">repeat after 15 s</text>
  <text class="s" x="837" y="268">browser speech + boxes</text>

  <path class="arrow" d="M230,70 L288,70"/>
  <path class="arrow" d="M540,70 L598,70"/>
  <path class="arrow" d="M770,110 C770,150 122,145 122,188"/>
  <path class="arrow" d="M225,235 L256,235"/>
  <path class="arrow" d="M463,235 L494,235"/>
  <path class="arrow" d="M701,235 L732,235"/>
  <text class="l" x="20" y="300">Boxes and labels are drawn for a sighted helper; the user only needs the spoken sentence.</text>
</svg>
