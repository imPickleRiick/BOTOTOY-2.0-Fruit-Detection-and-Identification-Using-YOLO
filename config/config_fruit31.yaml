# BOTOTOY 2.0 v2 (assistive fruit reader) - 31 fruit classes: the 30 tropical fruits (tangerines merged
# into orange) + apple and grape from the v1 dataset. Built by src/data/prepare_fruit31.py.
# Same structure as config.yaml; only the dataset, classes and model paths differ.
# All paths are relative to the project root (the folder that contains this config/ folder).

project:
  name: "BOTOTOY 2.0"
  title: "Fruit Detection and Identification Using YOLO"
  seed: 42

# Class order MUST match the dataset's data.yaml (class id = list index).
classes: [ambarella_fruit, avocado, banana, burmese_grape, carambola, cempedak, coconut, custard_apple, dragon_fruit, durian, grapefruit, guava, lanzones, lychee, mango, mangosteen, melon, orange, papayas, pear, persimmon, pineapple, pomegranate, rambutan, rose_apple, sapodilla, star_apple, watermelon, wood_apple, apple, grape]

dataset:
  # Public source (GitHub mirror of the Kaggle dataset). Pinned to a commit for reproducibility.
  github_repo: "lightly-ai/dataset_fruits_detection"
  github_commit: "e626559d4a127ea9fc35fedd74c52ee9f378a53d"
  kaggle_url: "https://www.kaggle.com/datasets/lakshaytyagi01/fruit-detection"
  license: "CC BY 4.0 (trucly/fruit-5ix6x v1) + CC0-1.0 (lightly-ai/dataset_fruits_detection)"

  raw_dir: "data/raw/trucly_fruit_v1"   # original download (read-only)
  processed_dir: "data/processed_fruit31"                 # final train/val/test folders
  audit_dir: "data/processed_fruit31/audit"               # cached CSV tables from the validator
  splits_dir: "data/splits_fruit31"                       # committed split manifests (file lists)
  data_yaml: "data/fruit31.yaml"                     # generated; used by Ultralytics
  image_extensions: [".jpg", ".jpeg", ".png", ".bmp"]

  validation:
    # dHash (64-bit perceptual hash) Hamming distance at or below which two images
    # are treated as near-duplicates. 0 = identical hash.
    near_duplicate_max_hamming: 4

  split:
    # Option A (approved): keep the original (augmented) training split, and re-split
    # the un-augmented original valid + test images ~50/50 into new val/test sets,
    # giving ~70/15/15 by unique source image.
    holdout_val_fraction: 0.5
    # Remove val/test images that are exact or near duplicates of a training image (leakage).
    exclude_holdout_duplicates_of_train: true

# ---------------------------------------------------------------------------
# Traditional OpenCV baseline (src/baseline). HSV uses OpenCV ranges:
# H 0-179, S 0-255, V 0-255. Hue/saturation ranges were chosen from the measured
# training-set color profiles (python -m src.baseline.color_calibration).
# ---------------------------------------------------------------------------
baseline:
  resize_max_side: 640        # images are processed at this size (longer side)
  blur_kernel: 5              # Gaussian blur kernel (odd); removes noise and fine texture

  color_ranges:               # one binary mask per color group: list of [lower HSV, upper HSV]
    red:    [[[0, 90, 50], [7, 255, 255]], [[165, 90, 50], [179, 255, 255]]]  # apples, watermelon flesh
    warm:   [[[8, 100, 70], [34, 255, 255]]]                                  # oranges, bananas, pineapples
    green:  [[[35, 70, 40], [85, 255, 255]]]                                  # green apples/grapes, melon rind
    purple: [[[95, 50, 20], [165, 255, 220]]]                                 # dark grapes (appear blue/purple)

  morphology:
    open_kernel: 5            # opening removes specks smaller than ~5 px
    open_iterations: 1
    close_kernel: 9           # closing fills holes/gaps smaller than ~9 px
    close_iterations: 2

  # Final values below were selected on the VALIDATION split; see outputs/baseline/ablation_val.md.
  min_area_fraction: 0.01     # ignore regions smaller than 1% of the image (smaller ones were ~98% false positives)
  max_area_fraction: 0.90     # ignore regions covering almost the whole image (background)

  split_touching:             # distance transform + watershed for touching round fruits
    enabled: false            # tested on validation: lowered mAP50 (0.053 -> 0.049) and doubled time
    groups: [warm, red]
    max_solidity: 0.90        # only try to split blobs that are clearly non-convex
    min_distance_ratio: 0.6   # peak threshold (fraction of the max distance)

  rules:                      # heuristic classification thresholds (see fruit_classifier.py)
    watermelon_flesh_max_extent: 0.60
    watermelon_flesh_min_area_fraction: 0.01
    banana_min_elongation: 2.2
    orange_max_hue: 20
    orange_min_saturation: 150
    round_min_circularity: 0.55
    pineapple_min_height_ratio: 1.25
    pineapple_max_saturation: 175
    watermelon_min_area_fraction: 0.04
    apple_min_circularity: 0.70
    apple_min_solidity: 0.90
    green_grapes_enabled: false  # bumpy green regions -> Grape; off because foliage is bumpy too
    grape_max_solidity: 0.85

  base_confidence:            # rule reliability used for the rule score (NOT a probability)
    Apple: 0.6
    Banana: 0.7
    Grape: 0.5
    Orange: 0.7
    Pineapple: 0.5
    Watermelon: 0.5

  size_reference_fraction: 0.05  # regions smaller than 5% of the image get a lower rule score

  # "Controlled scene" subset used to test the baseline where it is designed to work:
  # images whose area OUTSIDE the fruit boxes is mostly gray/white (low saturation).
  plain_background:
    max_saturation: 50                  # a background pixel counts as "plain" if S < 50
    min_plain_fraction: 0.7             # >= 70% of background pixels must be plain
    min_background_fraction: 0.3        # background must be >= 30% of the image

  nms_iou: 0.5                # overlapping boxes from different color masks are merged
  min_confidence: 0.0
  max_detections: 50

# ---------------------------------------------------------------------------
# YOLO11n (src/yolo). Training runs on Google Colab (T4 GPU); inference and
# evaluation run locally on the CPU.
# ---------------------------------------------------------------------------
yolo:
  model: "models/pretrained/yolo11n.pt"   # COCO-pretrained checkpoint (auto-downloaded, ~5 MB)
  trained_weights: "models/trained/bototoy_fruit31_yolo11n.pt"   # our fine-tuned model (best.pt)

  train:
    imgsz: 640
    epochs: 50
    batch: 16            # proposal suggested 8; a T4 (15 GB) handles 16 for YOLO11n -> steadier, faster
    patience: 10         # early stopping: stop if val fitness does not improve for 10 epochs
    optimizer: "SGD"     # explicit (Ultralytics 'auto' would also pick SGD for this many iterations)
    lr0: 0.01            # initial learning rate (Ultralytics default)
    momentum: 0.937
    seed: 42
    deterministic: true
    freeze: null         # null = fine-tune all layers; e.g. 10 = freeze the backbone
    workers: 2           # data-loading processes (Colab has 2 CPU cores)
    cache: false         # true/"disk" can speed up data loading if RAM/disk allow
    device: "auto"       # "auto" -> GPU 0 if available, else CPU
    project: "runs/train"
    name: "yolo11n_fruit31"

  inference:
    conf: 0.25           # minimum confidence to keep a detection
    iou: 0.7             # NMS IoU threshold (Ultralytics default)
    imgsz: 640
    max_det: 100
    device: "cpu"        # the team's laptops have no CUDA GPU

outputs:
  reports_dir: "outputs/reports"
  dataset_report_dir: "outputs/reports/dataset"
  num_sample_visualizations: 24
